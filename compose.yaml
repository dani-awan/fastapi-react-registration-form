services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: form_user
      POSTGRES_PASSWORD: local_demo_password
      POSTGRES_DB: form_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form_user -d form_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
